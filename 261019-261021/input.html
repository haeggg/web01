<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>input 태그</title>
        <style>
            h2{
                color: deepskyblue;
                text-align: center;
            }
            div{
                width: 100%;
            }
            fieldset{
                background-color: rgb(245, 245, 245);
                margin-top: 20px;
            }
            legend{
                padding: 5px;
                border: 1px solid #222;
                background-color: #fff;
                color: #000;
            }
            ul{
                list-style: none;
            }
            li{
                margin: 10px;
            }
            li label{
                width: 120px;
                float: left;
                text-align: right;
                padding-right: 15px;
            }
            input[type="submit"]{
                text-align: center;
                width: 100%;
                height: 30px;
                margin-top: 15px;
                background-color: deepskyblue;
            }
        </style>
    </head>
    <body>
        <h2>회원가입</h2>

        <!-- 로그인 정보 -->
        <div>
            <form>
                <fieldset>
                    <legend><b>로그인 정보</b></legend>

                    <ul>
                        <li>
                            <label for="user-id">아이디</label>
                            <input type="text" id="user_id">
                        </li>
                        <li>
                            <label for="user-pw">비밀번호</label>
                            <input type="password" id="user_pw">
                        </li>
                    </ul>
                </fieldset>

                <!-- 로그인 정보 -->
                <fieldset>
                    <legend><b>개인 정보</b></legend>

                    <ul>
                        <li>
                            <label for="user-name">이름</label>
                            <input type="text" id="user_name">
                        </li>
                        <li>
                            <label for="email">이메일</label>
                            <input type="email" id="email">
                        </li>
                        <li>
                            <label for="phone">전화번호</label>
                            <input type="tel" id="phone">
                        </li>
                        <li>
                            <label for="homep">블로그/ 홈페이지</label>
                            <input type="url" id="homep">
                        </li>
                    </ul>
                </fieldset>
                
                <input type="submit" value="가입하기">
                
            </form>
        </div>
    </body>
</html>
