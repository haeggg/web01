<!DOCTYPE html>
<html>
    <head>
        <meta charset="">
        <title>태그 선택자</title>
        <style>
            #main_text{
                color: blueviolet;
            }
            .text{
                font-size: 10px;
                margin-left: 10px;
            }
        </style>

    <body>
        <h1 id="main_text">블루베리와 항산화의 효능</h1>
        <p style="color: blue;">블루베리는 항산화제인 안토시아닌과 폴리페놀을 다량 포함하고 있습니다.</p>
        <p class="text">
            메사츄세스 보스톤에 있는 USDA 노화에 관한 인류 영양 연구센터
            (the USDA Human Nutrition Research Center on Aging)의 자료에 의하면 
            블루베리는 과일 중에서 가장 항산화 작용이 뛰어난 과일이라고 합니다.
        </p>
    </body>
