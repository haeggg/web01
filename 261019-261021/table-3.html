<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>caption 태그</title>
        <style>
            table, th, td{
                border: 0.5px solid #000;
            }
            th, td{
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <table>
            <caption>
                <strong>Modern Browser</strong>
                <p>국내에서 자주 사용하는 모던 브라우저</p>
            </caption>
            <tr>
                <th>브라우저</th>
                <th>제조업체</th>
                <th>다운로드</th>
            </tr>
            <tr>
                <th>크롬(Chrome)</th>
                <td>google</td>
                <td></td>
            </tr>
            <tr>
                <th>파이어폭스(Firfox)</th>
                <td>Mozilla</td>
                <td></td>
            </tr>
            <tr>
                <th>엣지(Edge)</th>
                <td>google</td>
                <td></td>
            </tr>

            <!-- 하단에 적은 caption 위치 확인용-->
            <caption>
                <strong>Modern Browser</strong>
                <p>국내에서 자주 사용하는 모던 브라우저</p>
            </caption>
            
            <!-- table 안에 caption은 무조건 테이블 위에 표시-->
        </table>
    </body>
</html>
