<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>표 만들기</title>
        <style>
            table, th, td{
                border: 1px solid #000000;
            }
            th{
                padding: 15px 0px;
            }
            td{
                padding: 8px;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <th>제목 셀</th>
                <td>1행 1열</td>
                <td>1행 2열</td>
                <td>1행 3열</td>
            </tr>
            <tr>
                <th></th>
                <td>2행 1열</td>
                <td>2행 2열</td>
                <td>2행 3열</td>
            </tr>
        </table>
    </body>
</html>
