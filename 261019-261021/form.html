<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>폼 태그</title>
    </head>
    <body>
        
        <h3>폼 태그 연습</h3>
        
        <!-- action, method, name 속성은 jsp로 보내기 위한 속성값-->

        <form action="search.jsp" method="get">
            <input type="text" title="검색" name="search">
            <input type="submit" value="검색">
        </form>
    </body>
</html>
