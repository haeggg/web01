<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>input 태그 7</title>
        <style>
            body{
                background-color: #ffF;
            }
            form fieldset{
                margin-bottom: 25px;
                background-color: #f5f5f5;
            }
            form legend{
                font-size: 15px;
                font-weight: 600;
            }
            form label.reg{
                color: green;
                font-size: 12px;
                width: 80px;
                font-weight: bold;
                float: left;
                text-align: left;
                margin-right: 10px;
            }
            form ul li{
                list-style: none;
                margin: 15px 0;
                font-size: 14px;
            }
            h3{
                text-align: center;
                color: yellowgreen;
            }
            button{
                background-color: yellowgreen;
                border: 0;
                width: 120px;
                height: 20px;
            }
            
            
        </style>
    </head>
    <body>
        <h3>여름방학 특강 신청</h3>
        <form>
            <fieldset>
                <legend>수강과목</legend>
                <ul>
                    <li>
                        <label class="reg" for="subj">영어회화(초급)</label>
                        <input type="text" id="subj" value="오전 9:00 ~ 11:00" readonly>
                    </li>
                </ul>
            </fieldset>
            <fieldset>
                <legend>신청자</legend>
                <ul>
                    <li>
                        <label class="reg" for="uname">이름</label>
                        <input type="text" id="uname" autofocus required>
                    </li>
                    <li>
                        <label class="reg" for="uid">학번</label>
                        <input type="text" id="uid" placeholder="하이픈 없이 입력" maxlength="8" required>
                    </li>
                    <li>
                        <label class="reg" for="uclass">학과</label>
                        <select>
                            <option value="archi">건축공학과</option>
                            <option value="archi">기계공학과</option>
                            <option value="archi" selected>산업공학과</option>
                            <option value="archi">전기전자공학과</option>
                            <option value="archi">컴퓨터공학과</option>
                            <option value="archi">화학공학과</option>
                        </select>
                    </li>
                </ul>
            </fieldset>
            <fieldset>
                <legend>교재 주문</legend>
                <ul>
                    <li>
                        <label class="reg" for="book">교재</label>
                        <input type="number" id="book" value="1" min="1" max="3">
                    </li>
                    <li>
                        <label class="reg" for="wsheet">워크시트</label>
                        <input type="number" id="wsheet" value="1" min="1" max="3">    
                    </li>
                    <li>
                        <label class="reg" for="group">워크시트</label>
                        <input type="number" id="group" value="10" min="10" max="100" step="10"> 
                    </li>
                </ul>
            </fieldset>
            <fieldset>
                <button type="submit" value="submit">신청하기</button>
                <button type="reset" value="reset">다시쓰기</button>
            </fieldset>
        </form>
    </body>
</html>
