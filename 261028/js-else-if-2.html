<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>중첩 if 문</title>

        <script>
            var id = "abc1234";
            var pw = "abcd1234";

            var user_id = prompt("아이디를 입력해 주세요.", "");
            var user_pw = prompt("비밀번호를 입력해 주세요.", "");

            if(id == user_id){

                if(pw == user_pw){
                    document.write(user_id + "님 반갑습니다!");
                }
                else{
                    document.write("비밀번호가 일치하지 않습니다.")
                    location.reload();
                }

            }
            else{
                document.write("아이디가 일치하지 않습니다.")
                location.reload();
            }
        </script>
    </head>
    <body>

    </body>
</html>
