<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>사칙연산 계산기</title>

        <script>
            
            var num1 = prompt("첫 번째 숫자를 입력하세요.", 0);
            var num2 = prompt("두 번째 숫자를 입력하세요.", 0);

            var result = 0;

            result = num1 + num2;
            document.write("■ + 값입니다. [ ", result, " ]", "</br>");

            result = num1 - num2;
            document.write("■ - 값입니다. [ ", result, " ]", "</br>");
            
            result = num1 * num2;
            document.write("■ x 값입니다. [ ", result, " ]", "</br>");

            result = num1 / num2;
            document.write("■ ÷ 값입니다. [ ", result, " ]", "</br>");
        </script>
    </head>
    <body>

    </body>
</html>
