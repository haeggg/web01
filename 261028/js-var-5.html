<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>
            증감 연산자
        </title>
        <script>
            var num1 = 10;
            var num2 = 20;
            var result;

            num1--; /* num1 10에서 1 감소 */
            document.write(num1, "</br>");

            num1++; /* num1 9에서 1 증가 */
            document.write(num1, "</br>");

            result = num2++; /* num2 대입하고 증가 > result에는 20 / num2는 대입된 이후 21 */
            document.write(result, "</br>");

            result = ++num2; /* num2 대입 전 증가 > result에는 22 / num2는 대입된 이후 22 */
            document.write(result, "</br>");

        </script>
    </head>
    <body>

    </body>
</html>
