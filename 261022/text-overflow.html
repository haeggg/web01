<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>text-overflow 활용</title>
        <style>
            .content{
                border: 0.5px solid #555;
                width: 250px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                line-height: 1.9;
            }
            .content:hover{
                width: 700px;
                overflow: visible;
            }
        </style>
    </head>
    <body>
        <h2>귀리(Oat)</h2>
        <p class="content">
            귀리는 베타글루칸(항암 및 면역증강작용을 가지고 있는
            불소화성 다당류) 성분을 포함하고 있다.
            <br>
            귀리는 베타글루칸(항암 및 면역증강작용을 가지고 있는
            불소화성 다당류) 성분을 포함하고 있다.
        </p>
    </body>
</html>
