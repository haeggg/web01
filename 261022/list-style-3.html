<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>list-style 활용3</title>
        <style>
            .inside{
                list-style-position: inside;
            }
            .outside{
                list-style-position: outside;
            }
        </style>
    </head>
    <body>
        <h1>이지스퍼블리싱</h1>

        <!-- list-style-position 을 지정하지 않은 리스트 -->
        <ul>
            <li>회사소개</li>
            <li>도서</li>
            <li>자료실</li>
            <li>질문답변</li>
            <li>동영상강의</li>
        </ul>

        <!-- list-style-position 을 지정한 리스트 -->
        <ul class="inside">
            <li>회사소개</li>
            <li>도서</li>
            <li>자료실</li>
            <li>질문답변</li>
            <li>동영상강의</li>
        </ul>

        <ul class="outside">
            <li>회사소개</li>
            <li>도서</li>
            <li>자료실</li>
            <li>질문답변</li>
            <li>동영상강의</li>
        </ul>
    </body>
</html>
