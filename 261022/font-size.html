<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>font-size 활용</title>
        <style>
            h1{
                font-size: 3em;
            }
            p{
                font-size: 1em;
            }
            .fon{
                font-size: 16px;
            }
        </style>
    </head>
    <body>
        <h1>3em의 크기를 가진 제목</h1>
        <p>1em의 크기를 가진 단락</p>
        <p class="fon">16px의 크기를 가진 단락</p>
    </body>
</html>
