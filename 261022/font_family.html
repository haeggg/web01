<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>font family 활용</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');
            .ng-font{
                font-family: 'Gowun Dodum';
            }
            p{
                font-size: 30px;
            }
        </style>
    </head>
    <body>
        <p>브라우저 기본 글꼴 사용</p>
        <p class="ng-font"><b>고운 돋움</b> 사용</p>
        <!-- 글씨체 바꿔도 b 태그 사용 가능 -->
    </body>
</html>
