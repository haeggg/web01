<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>font color 활용</title>
        <style>
            h1{
                color: rgb(135, 125, 0);
            }
            h2{
                color: gold;
            }
            .accent{
                color: #e82323;
            }
            .img1{
                width: 100px;
                float: right;
                margin-right: 10px;
            }

        </style>
    </head>
    <body>
        <h1>세계 10대 슈퍼푸드</h1>
        <img class="img1" src="https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2FMjAyNjA3MTRfMSAg%2FMDAxNzgzOTg3NzI3NTUy.ewkf8M16Sdp6y7wsBix00gYyOkFzy7zFBoMar710Eq4g.JRfUj1aOfbZoxuPGrgAY3pOBzXGGEbGLUTFfZPN5Fzog.JPEG%2F900_1783987726855.jpg&type=sc960_832" alt="garlic">
        <h2>마늘(Garlic)</h2>
        <p>
            일해백리 (一害百利)는 마늘의 별명이다.
            한 가지 해가 있고 백가지 이로움이 있다는 뜻이다.
            그 한 가지 해란, 아린 맛으로 인해 위에 부담을 준다는 것이다.
        </p>
        <p>
            마늘 특유의 아린 맛은<span class="accent"> 알리신</span>
            이라는 성분 때문으로, 살균 및 항균 작용을 하며
            마늘에 들어 있는 아연이 피로 회복에 도움을 준다.
        </p>
    </body>
</html>
