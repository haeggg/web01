<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>background-size 활용</title>
        <style>
            div{
                width: 500px;
                height: 500px;
                border: 2px double #000;
                margin-bottom: 30px;
            }
            .bg1{
                background: url(image/cat.png) no-repeat left top;
                background-size: auto;
            }
            .bg2{
                background: url(image/cat.png) no-repeat right bottom;
                background-size: 200px 150px;
            }
            .bg3{
                background: url(image/cat.png) no-repeat center;
                background-size: 60% 40%;
            }
            .bg4{
                background: url(image/cat.png) no-repeat left top;
                background-size: contain;
            }
            .bg5{
                background: url(image/cat.png) no-repeat left top;
                background-size: cover;
            }
            .bg6{
                background: url(image/cat.png) no-repeat left top;
                background-size: 100% 100%;
            }
        </style>
    </head>
    <body>
        <div class="bg1"></div>
        <div class="bg2"></div>
        <div class="bg3"></div>
        <div class="bg4"></div>
        <div class="bg5"></div>
        <div class="bg6"></div>
    </body>
</html>
