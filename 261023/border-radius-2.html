<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>border-radius 속성 2</title>
        <style>
            div{
                width: 250px;
                height: 300px;
                margin: 20px;
                display: inline-block;
                border: 2px solid green;
                border-radius: 200px 30px;
                background-color: lightgreen;
            }
            .bg{
                background: url(image/cat2.gif);
                background-size: cover;
            }

        </style>
    </head>
    <body>
        <div></div>
        <div class="bg"></div>
    </body>
</html>
