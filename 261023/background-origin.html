<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>background-origin 속성</title>
        <style>
            div{
                width: 400px;
                height: 200px;
                padding: 30px;
                border: 0.5px solid #000;
                margin-bottom: 20px;
            }
            .bg1{
                background-image: url(image/orange2.png);
                background-repeat: no-repeat;
                background-origin: padding-box;
            }
            .bg2{
                background-image: url(image/orange2.png);
                background-repeat: no-repeat;
                background-origin: border-box;
            }
            .bg3{
                background-image: url(image/orange2.png);
                background-repeat: no-repeat;
                background-origin: content-box;
            }
        </style>
    </head>
    <body>
        <div class="bg1"></div>
        <div class="bg2"></div>
        <div class="bg3"></div>
    </body>
</html>
