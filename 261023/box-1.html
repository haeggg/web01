<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>width, height 속성</title>
        <style>
            .box1{
                width: 500px;
                height: 100px;
                background: pink;
            }
            .box2{
                width: 50%;
                height: 100px;
                background: lightseagreen;
            }
            div{
                margin-bottom: 30px;
            }
        </style>
    </head>
    <body>
        <div class="box1"></div>
        <div class="box2"></div>
    </body>
</html>
