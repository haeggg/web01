<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>display 속성 3</title>
        <style>
            nav{
                width: 100%;
                height: 60px;
                background-color: lightseagreen;
                text-align: center;
            }
            nav ul{
                list-style-type: none;
            }
            nav ul li{
                display: inline-block;
                margin: 20px;
            }
            nav ul li a{
                color: white;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <nav>
            <ul>
                <li><a href="#">애완견 종류</a></li>
                <li><a href="#">입양하기</a></li>
                <li><a href="#">건강돌보기</a></li>
                <li><a href="#">더불어살기</a></li>
            </ul>
            <h1>애완견 종류</h1>
        </nav>
    </body>
</html>
