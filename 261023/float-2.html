<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>float</title>
        <style>
            .box1{
                padding: 20px;
                margin-right: 10px;
                background: orange;
                float: left;
            }
            .box2{
                padding: 20px;
                margin-right: 10px;
                background: skyblue;
                float: left;
            }
            .box3{
                padding: 20px;
                margin-right: 10px;
                background: darkred;
                float: left;
            }
            .box4{
                padding: 20px;
                margin-right: 10px;
                background: purple;
                float: right;
            }
        </style>
    </head>
    <body>
        <div class="box1">박스 1</div>
        <div class="box2">박스 2</div>
        <div class="box3">박스 3</div>
        <div class="box4">박스 4</div>
    </body>
</html>
