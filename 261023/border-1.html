<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>border 속성 1</title>
        <style>
            div{
                width: 200px;
                height: 100px;
                display: inline-block;
                margin: 15px;
                border-style: dashed;
                border-width: 10px 40px;
            }
            .box1{
                border-color: blue;
            }
            .box1{
                border-color: green;
            }
        </style>
    </head>
    <body>
        <div class="box1"></div>
        <div class="box1"></div>
    </body>
</html>
