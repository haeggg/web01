<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name=”viewport” content=”width=device-width, initial-scale=1”>

        <title>레이아웃 예제2</title>
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            #contatiner{
                width: 100%;
            }

            header{
                width: 100%;
            }
            header h1{
                font-size: 3em;
                text-align: center;
                color: firebrick;
                margin: 40px 0 20px 0
            }

            #pictures{
                width: 100%;
            }
            #pictures > article{
                position: relative;
                height: 400px;
                border: 1px solid firebrick;
                margin-bottom: 15px;
            }
            #image1, #image2, #image3, #image4, #image5{
                width: 100%;
            }
            #pictures h2{
                position: absolute;
                padding: 5px;
                font-size: 2em;
                color: white;
                text-shadow: 3px 3px 3px black;
                right: 3%;
                bottom: 10px;
            }

            #image1{
                background: url(image/autumn1.jpg) no-repeat center;
                background-size: cover;
            }
            #image2{
                background: url(image/autumn2.jpg) no-repeat center;
                background-size: cover;
            }
            #image3{
                background: url(image/autumn3.jpg) no-repeat center;
                background-size: cover;
            }
            #image4{
                background: url(image/autumn4.jpg) no-repeat center;
                background-size: cover;
            }
            #image5{
                background: url(image/autumn5.jpg) no-repeat center;
                background-size: cover;
            }

            footer{
                width: 100%;
                background:lightsalmon;
            }
            footer p{
                font-size: 1.2em;
                color: #eee;
                text-align: center;
                line-height: 200px;
            }
            
            @media all and (min-width:768px){

                #pictures{
                    display: flex;
                    flex-wrap: wrap;
                    justify-content: space-between;
                }
                #image1, #image2, #image3, #image4{
                    width: 49%;
                }
                #image5{
                    width: 100%;
                }

            }

            @media all and (min-width:992px){

                #image1, #image2, #image3, #image4, #image5{
                    width: 33%;
                }
                #image5{
                    margin-left: 0.5%;
                    flex: 2 2 0;
                }
                
            }
            
            
        </style>
    </head>
    <body>
        <div id="container">
            <header>
                <h1>가을 나들이</h1>
            </header>
            <section id="pictures">
                <article id="image1">
                    <h2>가을1</h2>
                </article> 

                <article id="image2">
                    <h2>가을2</h2>
                </article>

                <article id="image3">
                    <h2>가을3</h2>
                </article>

                <article id="image4">
                    <h2>가을4</h2>
                </article>

                <article id="image5">
                    <h2>가을5</h2>
                </article>
            </section>
            <section id="notice">

            </section>
            <footer>
                <p>가을 나들이를 떠나봐요</p>
            </footer>
        </div>
    </body>
</html>
