<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name=”viewport” content=”width=device-width, initial-scale=1”>

        <title>레이아웃 예제</title>
        <style>
            *{
                margin: 0;
                padding: 0;
            }

            /* 모바일 설정 */
            #container{
                width: 96%;
            }

            #container header{
                height: 200px;
                border: 1px solid #333;
                margin: 2%;
                padding: 30px;
            }
            #container article{
                width: 22.5%;
                /* 다시 계산 */
                height: 300px;
                border: 1px solid #333;
                margin: 2% 2%;
                padding: 30px;
            }
            
            .arti1{
                float: left;
            }
            .arti2{
                float: left;
            }
            .arti3{
                float: left;
            }

            .arti4{
                clear: both;
                float: left;
            }
            .arti5{
                float: left;
            }
            .arti6{
                float: left;
            }

            #container footer{

                clear: both;

                height: 300px;
                border: 1px solid #333;
                margin: 20px 20px;
                padding: 30px;
            }

            @media screen and (min-width:768px) and (max-width: 1024px){
                /* 태블릿 설정 */
                /*
                #container header{
                    clear: both;

                    width: 100%;

                    border: 1px solid #333;
                    margin: 20px 0;
                    padding: 30px;
                }

                #container article{
                    clear: both;

                    width: 100%;

                    border: 1px solid #333;
                    margin: 20px 0;
                    padding: 30px;
                }
                #container footer{
                    clear: both;

                    height: 300px;
                    border: 1px solid #333;
                    margin: 20px 0;
                    padding: 30px;
                }
                */

        
            }

            @media screen and (min-width:1024px){

                #container header{

                    width: 100%;
                    height: 200px;
                    border: 1px solid #333;
                    margin: 20px 0;
                    padding: 30px;
                }

                #container article{
                    clear: both;

                    width: 100%;
                    height: 300px;
                    border: 1px solid #333;
                    margin: 20px 0;
                    padding: 30px;
                }
                #container footer{
                    clear: both;
                    
                    height: 300px;
                    border: 1px solid #333;
                    margin: 20px 0;
                    padding: 30px;
                }

            }
        </style>
    </head>
    <body>
        <div id="container">
            <header>
                <h1>header 부분</h1>
            </header>
            <section>
                <article class="arti1">
                    <h1>article 부분1</h1>
                </article>

                <article class="arti2">
                    <h1>article 부분2</h1>
                </article>

                <article class="arti3">
                    <h1>article 부분3</h1>
                </article>

                <article class="arti4">
                    <h1>article 부분4</h1>
                </article>

                <article class="arti5">
                    <h1>article 부분5</h1>
                </article>
            </section>
            <footer>
                <h1>footer 부분</h1>
            </footer>
        </div>
    </body>
</html>
