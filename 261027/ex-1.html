<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name=”viewport” content=”width=device-width, initial-scale=1”>

        <title>레이아웃 예제</title>
        <style>
            *{
                margin: 0;
                padding: 0;
            }

            /* 모바일 설정 */
            #container{
                width: 500px;
            }

            #container header{

                height: 200px;
                border: 1px solid #333;
                margin: 10px;
                padding: 30px;
            }
            
            #container section article{

                height: 200px;
                border: 1px solid #333;
                margin: 10px;
                padding: 30px;
            }

            #container footer{

                clear: both;

                height: 200px;
                border: 1px solid #333;
                margin: 10px;
                padding: 30px;
                background-color: forestgreen;    
            }

            @media screen and (min-width:768px) and (max-width: 1024px){
                /* 태블릿 설정 */

                #container{
                    width: 800px;
                }

                #container header{
                    
                    height: 200px;
                    border: 1px solid #333;
                    margin: 10px;
                    padding: 30px;
                }

                section{
                    margin: 0;
                }

                section article{
                    margin: 0;
                }

                
                
                .arti1{
                    float: left;
                    width: 310px;
                }
                .arti2{
                    float: right;
                    width: 310px;
                }
                .arti3{
                    clear: both;

                    float: left;
                    width: 310px;
                }

                .arti4{
                    float: right;
                    width: 310px;
                }
                /*
                .arti5{
                    clear: both;
                    width: 100%;
                }
                    */
                .arti5{
                    clear: both;
                    width: 800px;
                }
                

                #container footer{
                    width: 740px;
                    margin: 10px;
                    border: 1px solid #333;
                    padding: 30px;
                }   

        
            }

            @media screen and (min-width:1024px){

                #container{
                    width: 96%;
                }

                #container header{

                    height: 200px;
                    border: 1px solid #333;
                    margin: 2%;
                    padding: 30px;
                }

                section{
                    margin: 2% 0;
                }
                #container article{
                    display: inline-block;

                    /* 다시 계산 */
                    height: 300px;
                    border: 1px solid #333;
                    margin: 0;
                }
                
                .arti1{
                    float: left;
                    width: 23%;
                }
                .arti2{
                    float: left;
                    width: 23%;
                }
                .arti3{
                    float: left;
                    width: 23%;
                }

                .arti4{
                    clear: both;
                    float: left;
                    width: 23%;
                }
                .arti5{
                    float: left;
                    width: 58%;
                }
                

                #container footer{
                    clear: both;
                        
                    height: 300px;
                    border: 1px solid #333;
                    margin: 2%;
                    padding: 30px;
                }   

            }
        </style>
    </head>
    <body>
        <div id="container">
            <header>
                <h1>header 부분</h1>
            </header>
            <section>
                <article class="arti1">
                    <h1>article 부분1</h1>
                </article>

                <article class="arti2">
                    <h1>article 부분2</h1>
                </article>

                <article class="arti3">
                    <h1>article 부분3</h1>
                </article>

                <article class="arti4">
                    <h1>article 부분4</h1>
                </article>

                <article class="arti5">
                    <h1>article 부분5</h1>
                </article>
            </section>
            <footer>
                <h1>footer 부분</h1>
            </footer>
        </div>
    </body>
</html>
