<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        
        <title>가변 글꼴 em</title>
        <meta name=”viewport” content=”width=device-width, initial-scale=1”>

        <style>
            #wrapper{
                width: 96%;
                margin: 0 auto;
            }
            header{
                width: 100%;
                height: 120px;
                background-color: coral;
            }
            .header-text{
                font-size: 3em;
                color: white;
                text-align: center;
                line-height: 120px;
            }
            .content{
                float: left;
                width: 62.5%;
                height: 400px;
                padding: 1.5625%;
                background-color: yellow;
                text-align: center;
                line-height: 380px;
                font-size: 1.5em;
            }
            .right-side{
                float: right;
                width: 31.25%;
                height: 400px;
                padding: 1.5625%;
                background-color: green;
                text-align: center;
                line-height: 380px;
                font-size: 1.5em;
            }
            footer{
                clear: both;
                width: 100%;
                height: 120px;
                background-color: brown;
                text-align: center;
                line-height: 120px;
                font-size: 1.5em;
            }
        </style>
    </head>
    <body>
        <div id="wrapper">
            <header>
                <h1 class="header-text">가변 그리드 레이아웃</h1>
            </header>
            <section class="content">
                <h4>본문</h4>
            </section>
            <aside class="right-side">
                <h4>사이드바</h4>
            </aside>
            <footer>
                <h4>푸터</h4>
            </footer>
        </div>
    </body>
</html>
