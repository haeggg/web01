<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name=”viewport” content=”width=device-width, initial-scale=1”>

        <title>INSPIRATIONAL QUOTES</title>
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body{
                background-color:indianred;
            }
            #container{
                width: 320px;
                margin: 50px auto;
            }
            .card{
                position: relative;
                width: 300px;
                height: 500px;
                margin: 20px 10px;
                border: 1px solid firebrick;
                background-color: #fff;
            }
            .card img{
                width: 298px;
                height: 298px;
            }
            .words{
                position: absolute;
                left: 10px;
                top: 300px;
                padding: 10px;
                text-align: center;
            }
            h2{
                margin-top: 30px;
            }
            
            @media screen and (min-width:768px) and (max-width:1719px){
                #container{
                    width: 570px;
                    margin: 50px auto;
                }
                .card{
                    position: relative;
                    width: 550px;
                    height: 250px;
                    margin: 20px 10px;
                    border: 1px solid firebrick;
                    background-color: #fff;
                }
                .card img{
                    width: 270px;
                    height: 248px;
                }
                .words{
                    position:absolute;
                    left: 310px;
                    top: 50px;
                    text-align: center;
                    width: 200px;
                }
                h2{
                    margin-top: 10px;
                }
            }

            @media screen and (min-width:1720px){
                #container{
                    width: 1710px;
                    margin: 50px auto;
                }
                .card{
                    position: relative;
                    float: left;
                    width: 550px;
                    height: 250px;
                    margin: 10px;
                    border: 1px solid firebrick;
                    background-color: #fff;
                }
                .card img{
                    width: 270px;
                    height: 248px;
                }
                .words{
                    position: absolute;
                    left: 310px;
                    top: 50px;
                    text-align: center;
                    width: 200px;
                }
                h2{
                    margin-top: 10px;
                }
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div class="card">
                <img src="image/autumn1.jpg">
                <div class="words">
                    <h2>일 분 전만큼 먼 시간은 없다.</h2>
                    <h3>- Jim Bishop</h3>
                </div>
            </div>
            <div class="card">
                <img src="image/autumn2.jpg">
                <div class="words">
                    <h2>웃음은 마음의 조깅이다.</h2>
                    <h3>- Norman Cousins</h3>
                </div>
            </div>
            <div class="card">
                <img src="image/autumn3.jpg">
                <div class="words">
                    <h2>낡은 옷은 그냥 입고 새 책을 사라.</h2>
                    <h3>- Austin Phelps</h3>
                </div>
            </div>
        </div>
    </body>
</html>
