<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>figcaption 태그</title>
        <style>
            table, th, td{
                border: 1px solid #000;
            }
            th, td{
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <figure>
            <figcaption>
                <p>국내에서 자주 사용하는 <b>모던 브라우저</b></p>
            </figcaption>

            <table>
                <tr>
                    <th>브라우저</th>
                    <th>제조업체</th>
                    <th>다운로드</th>
                </tr>
                <tr>
                    <th>크롬(Chrome)</th>
                    <td>google</td>
                    <td></td>
                </tr>
                <tr>
                    <th>파이어폭스(Firfox)</th>
                    <td>Mozilla</td>
                    <td></td>
                </tr>
                <tr>
                    <th>엣지(Edge)</th>
                    <td>google</td>
                    <td></td>
                </tr>
            </table>

            <!-- 하단에 적은 figcaption 위치 확인용-->
            <figcaption>
                <p>국내에서 자주 사용하는 <b>모던 브라우저</b></p>
            </figcaption>

            <!-- figcaption은 아래 표시 가능-->
        </figure>
    </body>
</html>
