<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>가상 클래스 1</title>
        <style>
            .container{
                width: 960px;
                margin: 0 auto;
            }
            .nav1{
                width: 960px;
                height: 60px;
                padding-bottom: 10px;
                border-bottom: 2px solid #000;
            }

            .nav ul{
                list-style: none;
                padding-top: 10px;
                padding-bottom: 5px;
            }
            .nav1 ul li{
                display: inline-block;
                width: 150px;
                padding: 10px;
            }
            .nav1 a:link, .nav1 a:visited{
                font-size: 14px;
                padding: 10px;
                text-decoration: none;
            }
            .nav1 a:hover, .nav1 a:focus{
                background-color: #222;
                color: #fff;
            }

            .nav1 a:active{
                background-color:  #f00;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <nav class="nav1">
                <ul>
                    <li><a href="#">이용 안내</a></li>
                    <li><a href="#">객실 소개</a></li>
                    <li><a href="#">예약 방법 및 요금</a></li>
                    <li><a href="#">예약하기</a></li>
                </ul>
            </nav>
        </div>
    </body>
</html>
