<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>가상 요소</title>
        <style>
            .container{
                border: 1px solid #000;
                padding: 10px;
                margin: 0 auto;
                width: 200px;
                padding: 10px 20px;
            }

            ul li{
                margin: 15px 15px;
            }

            li.hot::first-line{
                content: "NEW!!";
                font-size: x-small;
                padding: 2px 4px;
                margin: 0 10px;
                border-radius: 2px;
                background-color: aqua;
                color: darkcyan;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>제품 목록</h1>
            <ul>
                <li class="hot">제품 A</li>
                <li>제품 B</li>
                <li>제품 C</li>
                <li class="hot">제품 D</li>
            </ul>
        </div>
    </body>
</html>
