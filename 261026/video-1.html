<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>동영상 대문 홈페이지</title>
        <style>
            #container{
                position: relative;
                text-align: center;
                margin-top: 30%;
                margin-left: 30%;
            }
            h2{
                font-size: 2em;
            }
            h1{
                font-size: 2em;
            }
            a:link, a:visited{
                text-decoration: none;
                color: #222;
            }
            a:hover{
                cursor: pointer;
            }
            #bg{
                position: fixed;
                left: 0;
                top: 0;

                width: auto;
                height: auto;
                min-width: 100%;
                min-height: 100%;

                z-index: -100;
                background: url(image/cat2.gif) left top no-repeat;
                background-size: cover;
            }
        </style>
    </head>
    <body>
        <video src="media/flame.mp4" autoplay loop muted poster="image/cat2.gif" id="bg"></video>
        <div id="container">
            <h2>사람을 구체적으로 도와주는 책</h2>
            <h1><a href="https://www.easyspub.co.kr">이지스퍼블리싱</a></h1>
        </div>
    </body>
</html>
