<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>text-align 속성</title>
        <style>
            table, td{
                border: 1px solid #000;
            }
            td{
                width: 100px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <table>
            <caption>셀 가운데 정렬</caption>
            <tr>
                <td>내용1</td>
                <td>내용2</td>
                <td>내용3</td>
                <td>내용4</td>
            </tr>
        </table>
    </body>
</html>
