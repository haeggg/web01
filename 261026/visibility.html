<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>visibility 속성</title>
        <style>
            img{
                margin: 20px;
                padding: 10px;
                border: 0.5px solid black;
            }
            .invisible{
                visibility: hidden;
            }
        </style>
    </head>
    <body>
        <img src="image/cat2.gif">
        <img src="image/cat2.gif" class="invisible">
        <img src="image/cat2.gif">
    </body>
</html>
