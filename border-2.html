<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>border 속성 2</title>
        <style>
            h1{
                padding-bottom: 5px;
                border-bottom: 2px solid #888;
            }
            p{
                padding: 10px;
                border: 5px solid #000;
            }
        </style>
    </head>
    <body>
        <h1>박스 모델</h1>
        <p>
            박스모델은 실제 콘텐츠 영역, 박스와 콘텐츠 영역 사이 여백인 패딩,
            박스의 테두리, 그리고 여러 박스 모델 간의 여백인 마진 등의
            요소로 구성되어 있습니다.
        </p>
    </body>
</html>
