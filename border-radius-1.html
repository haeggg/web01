<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>border-radius 속성 1</title>
        <style>
            div{
                width: 300px;
                height: 200px;
                margin: 20px;
                display: inline-block;
            }
            .round{
                border: 2px solid green;
                border-radius: 20px;
            }
            #bg{
                background: url(image/cat2.gif);
                background-size: cover;
            }
        </style>
    </head>
    <body>
        <div class="round"></div>
        <div class="round" id="bg"></div>
    </body>
</html>
