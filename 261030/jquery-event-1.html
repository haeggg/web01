<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>엘러먼트 셀렉터 연습</title>
        
        <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous">
        </script>

        <script>
            
            $(function(){

                $(".btn1").click(function(){
                    $(".btn1").parent().next()
                    .css({"color":"#f00"});
                });

                $(".btn2").on({

                    "mouseover focus": function(){
                        $(".btn2").parent().next()
                        .css({"color":"#0f0"});
                    },
                    "mouseout blur": function(){
                        $(".btn2").parent().next()
                        .css({"color":"#000"});
                    },

                });

            });
            
        </script>

    </head>
    <body>
        
        <p>
            <button class="btn1">버튼 1</button>
        </p>
        <p>
            내용1
        </p>

        <p>
            <button class="btn2">버튼 2</button>
        </p>
        <p>
            내용2
        </p>
    </body>
</html>
