<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>선택자</title>
        
        <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous">
        </script>

        <script>
            $(function(){
                var copyObj = $(".box1").children().clone();
                $(".box2").remove();

                $(".box3").empty();
                $(".box3").append(copyObj);
            });
        </script>

    </head>
    <body>

        <div class="box1">
            <p>내용1</p>
            <p>내용2</p>
        </div>

        <div class="box2">
            <p>내용3</p>
            <p>내용4</p>
        </div>

        <div class="box3">
            <p>내용5</p>
            <p>내용6</p>
        </div>
    </body>
</html>
