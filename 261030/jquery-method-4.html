<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>선택자</title>
        
        <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous">
        </script>

        <script>
            $(function(){
                var srcVal = $("#sec_1 img").attr("src");
                console.log(srcVal);

                $("#sec_1 img")
                .attr({
                    "width" : "200",
                    "src" : srcVal.replace("1.gif", "5.gif"),
                    "alt": "흰둥이"
                })
                .removeAttr("border");
            });
        </script>

    </head>
    <body>

        <h1><strong>객체 조작 및 생성</strong></h1>
        <section id="sec_1">
            <h2>이미지 속성</h2>
            <p><img src="image/pic_1.gif" alt="사진" border="2">
                </p>
        </section>

    </body>
</html>
