<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>함수</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <style>
            *{
                margin: 0;
                padding: 0;
            }

            #galleryZone{
                text-align: center;
            }

            #galleryZone img{
                margin: 30px;
                height: 400px;
            }
        </style>

        <script>
            var num = 1;

            function gallery(direct){
                
                if(direct){
                    if(num == 8) return;
                    num++;
                }
                else{
                    if(num == 1) return;
                    num--;
                }

                var imgTag = document.getElementById("photo");
                imgTag.setAttribute("src", "image/pic_" + num + ".gif");
            }
        </script>

    </head>
    <body>
        <div class="position-absolute top-50 start-50 translate-middle">
            
            <p>
                <img src="image/pic_1.gif" id="photo" alt="" class="rounded-3">
            </p>
            
            <div class="position-absolute top-0 start-50 translate-middle">
                <button type="button" onclick="gallery(0)" class="btn btn-info">이전</button>
                <button type="button" onclick="gallery(1)" class="btn btn-light">다음</button>
            </div>

        </div>
    </body>
</html>
