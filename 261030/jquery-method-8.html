<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>선택자</title>
        
        <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous">
        </script>

        <script>
            $(function(){
               
                $("<li>appendTo</li>").appendTo("#listZone");
                /* 마지막에 추가하는 것 */

                $("#listZone").prepend("<li>prepend</li>");
                /* 위에 추가하는 것 */

            });
        </script>

    </head>
    <body>

        <ul id="listZone">
            <li>리스트</li>
        </ul>

    </body>
</html>
