<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>선택자</title>
        
        <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous">
        </script>

        <script>
            $(function(){
                $("h2").replaceWith("<h3>replace method</h3>");
                /* h2 태그 부분을 <h3>~</h3> 내용으로 변경 */

                $("<p>change</p>").replaceAll("div");
                /* div 태그 부분 모두 <p>~</p> 내용으로 변경 */
            });
        </script>

    </head>
    <body>
        <section class="box1">
            <h2>제목1</h2>
            <div>내용1</div>
            <div>내용2</div>
        </section>
        <section class="box1">
            <h2>제목2</h2>
            <div>내용3</div>
            <div>내용4</div>
        </section>
    </body>
</html>
