<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>배열 객체</title>

        <script>
            var arr = [30, "따르릉", true];

            document.write("<h3>배열값 가져오기 ⓐ</h3>");

            document.write(arr[0], "<br>");
            document.write(arr[1], "<br>");
            document.write(arr[2], "<br>");

            document.write("<h3>배열값 가져오기 ⓑ</h3>");

            for(var i = 0; i < arr.length; i++){
                document.write(arr[i], "<br>");
            }

            document.write("<h3>배열값 가져오기 ⓒ</h3>");

            /* in > 인덱스만 가져옴 */
            for(i in arr){
                document.write(arr[i], "<br>");
            }

            document.write("<h3>배열값 가져오기 ⓓ</h3>");

            /* of > 값만 가져옴 */
            for(i of arr){
                document.write(i, "<br>");
            }

        </script>
    </head>
    <body>

    </body>
</html>
