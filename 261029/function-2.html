<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>함수 정의문</title>

        <script>
            function aaa(){
                var a = 5;
                var b = a + 5;
                var c = b + 5;

                document.write("b = " + b + "</br>");
                document.write("c = " + c + "</br>");
            }

            /*
            지역 변수는 선언된 곳 외에 다른 곳에서 사용이 어려움

            (확인용 코드)
            var test = b;
            document.write(test);
            */

        </script>
    </head>
    <body>
        <script>
            aaa();
        </script>
    </body>
</html>
