<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>
            box-shadow 속성
        </title>
        <style>
            div{
                width: 300px;
                height: 100px;
                display: inline-block;
                margin: 15px;
                /* border: 2px solid; */
                border-radius: 20px;
            }
            .box1{
                box-shadow: 2px -2px 5px 0px #000;
            }
            .box2{
                box-shadow: 5px 5px 0px 3px #555;
            }
        </style>
    </head>
    <body>
        <div class="box1"></div>
        <div class="box2"></div>
    </body>
</html>
