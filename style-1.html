<!DOCTYPE html>

    <head>

        <link rel="stylesheet" href="css/style.css">
        
        <style>
            section{
                width: 500px;

        <link rel="stylesheet" href="css/style.css">

        <!-- 
        익스터널 처리 확인용

        * 익스터널, 인터널, 인라인을 함께 쓸 경우, 인라인 속성으로 적용
