<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>버튼 태그</title>
        <style>
            .subm{
                display: block;
                background-color: #fff;
                border: 0.5px solid #999999;
                cursor: pointer;
                padding: 7px 10px;
            }
            .subm img{
                width: 15px;
                height: 15px;
                padding: 0;
                border: 0;
            }
            .subm:hover{
                background-color: #ffebda;
                border: rgb(255, 197, 144);
                color: rgb(255, 115, 0);
            }
        </style>
    </head>
    <body>
        <form>
            <button type="submit" class="subm">
                <img src="image/check.png" alt="체크 이미지"> 전송하기
            </button>
        </form>
    </body>
</html>
