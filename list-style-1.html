<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>list-style 활용2</title>
        <style>
            ol{
                list-style-type: armenian;
            }
            ul{
                list-style-type: circle;
            }
        </style>
    </head>

    <body>
        <h1>도서시리즈</h1>

        <ol>
            <li>Do it 시리즈</li>
            <li>된다 시리즈</li>
            <li>DCM 프로 사진가</li>
            <li>데이터과학 시리즈</li>
        </ol>

        <ul>
            <li>하면 시리즈</li>
            <li>뭐든 된다 시리즈</li>
            <li>영상 촬영 시리즈</li>
            <li>웹디자인 시리즈</li>
        </ul>
    </body>
</html>
