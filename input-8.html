<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>
            input 태그 8
        </title>
        <style>
            body{
                background-color: #fff;
            }
            form legend{
                color: cadetblue;
                font-size: 18px;
                font-weight: 600;
            }
            form label.reg{
                float: left;
                text-align: left;
                width: 120px;
            }
            form ul li{
                list-style: none;
                margin: 15px 0;
            }
            form .easys{
                text-align: left;
                font-size: 12px;
                color: #333333;
            }
            form fieldset.sendform{
                text-align: center;
            }
            form label.login_g{
                width: 100px;
                margin-right: 10px;
            }
            form input.login_input{
                margin-right: 10px;
            }
            /* 큰 틀에 text-align 지정해 주면 설정됨 */
        </style>
    </head>
    <body>
        <form>
            <fieldset class="login">
                <legend>로그인</legend>
                <table>
                    <tr>
                        <td>
                            <label class="login_g" for="user_id">아이디:</label>
                            <input class="login_input" type="text" id="user_id" size="10" autofocus>
                        </td>
                        <td>
                            <label class="login_g" for="user_pw">비밀번호:</label>
                            <input class="login_input" type="password" id="user_pw" size="10">
                        </td>
                        <td>
                            <input type="submit" value="로그인">
                        </td>
                    </tr>
                </table>
            </fieldset>
            <fieldset class="register">
                <legend>가입하기</legend>
                <ul>
                    <li>
                        <label class="reg" for="new_id">아이디</label>
                        <input type="text" id="new_id" size="20" autocomplete="on" required>
                    </li>
                    <li>
                        <label class="reg" for="new_pw">비밀번호</label>
                        <input type="password" id="new_pw" size="20" required>
                    </li>
                    <li>
                        <label class="reg" for="new_pw2">비밀번호 확인</label>
                        <input type="password" id="new_pw2" size="20" required>
                    </li>
                    <hr>
                    <li>
                        <label class="reg" for="user_name">이름</label>
                        <input type="text" id="user_name" size="20" required>
                    </li>
                    <li>
                        <label class="reg" for="user_mail">메일 주소</label>
                        <input type="mail" id="user_mail" size="20" required>
                    </li>
                    <li>
                        <label class="reg" for="user_tel">전화번호</label>
                        <input type="tel" id="user_tel" size="20">
                    </li>
                </ul>
            </fieldset>
            <fieldset class="easys">
                <legend>이지스퍼블리싱</legend>
                <textarea name="intro" cols="60" rows="5">
열심히 사는 사람들의 손을 잡아주는 곳 - 이지스 퍼블리싱

우리는 책을 내기 전에 다시 한번 물어봅니다.
"이 책이 사람들에게 도움이 되는가?"

더 쉽게, 더 빠르게 지식을 전달하고 싶습니다.
이지스 퍼블리싱의 책과 앱을 만나보세요.
                </textarea>
            </fieldset>
            <fieldset class="sendform">
                <input type="submit" value="가입하기">
                <input type="submit" value="다시쓰기">
            </fieldset>
        </form>
    </body>
</html>
