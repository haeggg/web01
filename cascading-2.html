<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>캐스캐이딩 확인</title>
        <style>
            *{
                margin: 20px auto;
            }
            body{
                color: gray;
            }
            #container{
                width: 600px;
                padding: 15px;
                border: 1px solid gray;
            }
            h2{
                color: coral !important;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <h2 style="color: purple;">이지스퍼블리싱의 미션</h2>
            <p>
                사람들에게 구체적으로 도움을 주는 책,
                <br>
                우리는 열심히 사는 사람들에게 도움이 되고 싶습니다.
            </p>
            <p>우리는 책을 출간하기 전에 질문할 것입니다.</p>
            <p style="color: mediumseagreen; font-style: italic;">"이 책이 사람들에게 도움이 됩니까?"</p>
        </div>
    </body>
</html>
