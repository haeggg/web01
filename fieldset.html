<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>fieldset 과 legend 태그</title>
        <style>
            ul{
                list-style: none;
            }
            li{
                margin: 20px;
            }
            li label{
                width: 80px;
                /* float: left; */
            }
            fieldset{
                margin: 15px;
            }
        </style>
    </head>
    <body>
        <fieldset>
            <legend>개인 정보</legend>

            <ul>
                <li>
                    <label for="name">이름</label>
                    <input type="text" id="name">
                </li>
                <li>
                    <label for="mail">이메일</label>
                    <input type="text" id="mail">
                </li>
            </ul>
        </fieldset>
        <fieldset>
            <legend>로그인 정보</legend>

            <ul>
                <li>
                    <label for="user_id">아이디</label>
                    <input type="text" id="user_id">
                </li>
                <li>
                    <label for="user_pw">비밀번호</label>
                    <input type="text" id="user_pw">
                </li>
            </ul>
        </fieldset>
    </body>
</html>
