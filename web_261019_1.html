<!DOCTYPE html>
<html>
    <head>
        <meta charset = "utf-8">
        <title>261019 페이지 만들기(오전 수업)</title>
    </head>
    <body>
        <!-- 제목 부분 -->
        <h1>
            html 코드 배우기
        </h1>
        <h6>
            hn, br, p 코드를 배웁니다.
        </h6>

        <!-- 본문 부분 -->
        <hr>
        <p>
            hn :  제목 태그(1이 제일 큰 글씨 / 6이 제일 작은 글씨)
            <br>
            br: 줄바꿈 태그
            <br>
            p: 본문 태그
        </p>

        <pre>
            pre: 공백이나 줄 부분을
                 표     현하는 태그
        </pre>

        <p>
            강조는 <strong>strong 태그</strong>와
            <br>
            <b>b 태그</b>가 있음
        </p>

        <p>
            흐름상 강조 이텔릭 태그는 <em>em 태그</em>
            <br>
            이텔릭체 태그는 <i>i 태그</i>
        </p>
    </body>
</html>
