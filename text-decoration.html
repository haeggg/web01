<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>text-decoration 활용</title>
        <style>
            p{
                line-height: 1.8;
            }
            a{
                text-decoration: none;
                color: green;
            }
            .edited{
                text-decoration: line-through;
            }
        </style>
    </head>
    <body>
        <h2>HTML5</h2>
        <p>
            다양한 기기로 인터넷에 접속할 수 있는 요즘,
            <br>
            <span class="edited">HTML4</span> HTML5를 공부해야 할 때입니다.
        </p>
        <p>
            <a href="https://html.spec.whatwg.org" target="_blank">
            <b>표준 규약 살펴보기</b></a>
        </p>
    </body>
</html>
