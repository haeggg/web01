<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>padding 속성</title>
        <style>
            div{
                width: 300px;
                height: auto;
                background:  skyblue;
                display: inline-block;
                margin: 15px;
                color: white;
            }
            .box1{
                padding: 10px 30px 20px 15px;
            }
            .box2{
                padding: 10px 15px;
            }
            .box3{
                padding: 50px;
            }
        </style>
    </head>
    <body>
        <div class="box1">패딩이란 콘텐츠 영역과 테두리 사이의 여백을 말합니다.</div>
        <div class="box2">패딩이란 콘텐츠 영역과 테두리 사이의 여백을 말합니다.</div>
        <div class="box3">패딩이란 콘텐츠 영역과 테두리 사이의 여백을 말합니다.</div>

    </body>
</html>
