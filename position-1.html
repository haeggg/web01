<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>position relative 속성</title>
        <style>
            .box1-1{
                float: left;
                width: 100px;
                background: #ffd800;
                margin-right: 10px;
                padding: 20px;
            }
            .box1-2{
                width: 300px;
                background: #0094ff;
                float: left;
                padding: 20px;
            }
            .box2-1{
                float: left;
                width: 100px;
                background: #ffd800;
                margin-right: 10px;
                padding: 20px;
            }
            .box2-2{
                position: relative;
                left: -90px;
                top: 30px;
                width: 300px;
                background: #0094ff;
                float: left;
                padding: 20px;
            }
        </style>
    </head>
    <body>
        <div class="box1-1">박스1</div>
        <div class="box1-2">박스2</div>

        <br>
        <br>
        <br>
        <br>
        <br>
        <br>

        <div class="box2-1">박스1</div>
        <div class="box2-2">박스2</div>
    </body>
</html>
