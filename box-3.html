<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>display 속성 2</title>
        <style>
            nav ul{
                list-style-type: none;
            }
            nav ul li{
                display: inline;
                padding: 10px 15px;
                margin-right: 25px;
                border-top: 5px solid green;
            }
            nav ul li:hover{
                background-color: lightyellow;
            }
            nav ul li a{
                text-decoration: none;
                color: darkgreen;
            }
        </style>
    </head>
    <body>
        <nav>
            <ul>
                <li><a href="#">애완견 종류</a></li>
                <li><a href="#">입양하기</a></li>
                <li><a href="#">건강돌보기</a></li>
                <li><a href="#">더불어살기</a></li>
            </ul>
        </nav>
    </body>
</html>
