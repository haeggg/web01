<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>input 태그 활용 6</title>
        <style>
            body{
                border: 0;
            }
            td{
                padding: 5px 10px;
                border: 0;
                vertical-align: middle;
            }
            input[type="image"]{
                width: 30px;
            }
        </style>
    </head>
    <body>
        <h2>회원가입</h2>
        <form method="get" action="image" enctype="utf-8">
            <table>
                <tr>
                    <td>
                        <label>아이디 : <input type="text" size="15" name="user_id"></label>
                    </td>
                    <td>
                        <label>아이디 : <input type="password" size="15" name="user_pw"></label>
                    </td>
                    <td>
                        <input type="image" id="butt_on" src="image/cat2.gif" onclick="submit()">
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
