<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>background-size 활용</title>
        <style>
            div{
                width: 500px;
                height: 500px;
                border: 2px double #000;
                margin-bottom: 30px;
            }
            .bg1{
                background: url(image/cat.png) no-repeat left top;
            }
            .bg2{
                background: url(image/cat.png) repeat-x left top;
            }
            .bg3{
                background: url(image/cat.png) repeat-y left top;
            }
            .bg4{
                background: url(image/cat.png) repeat left top;
            }
        </style>
    </head>
    <body>
        <div class="bg1"></div>
        <div class="bg2"></div>
        <div class="bg3"></div>
        <div class="bg4"></div>
    </body>
</html>
